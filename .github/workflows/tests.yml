name: testes-python
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências e rodar os testes definidos em pyproject.toml
        run: uv run --group dev python -m pytest -q
      - name: Validar sintaxe PowerShell do SEC-052 (sem executar chamadas)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/SEC-052.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
          Write-Host 'Sintaxe SEC-052 valida.'
          $diagTokens = $null
          $diagErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/SEC-053.ps1', [ref]$diagTokens, [ref]$diagErrors) | Out-Null
          if ($diagErrors.Count -gt 0) {
            $diagErrors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
          Write-Host 'Sintaxe SEC-053 valida. Nenhuma chamada HTTP foi executada.'
