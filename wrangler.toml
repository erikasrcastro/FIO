name = "fio"
main = "worker.py"
compatibility_date = "2026-10-28"
compatibility_flags = ["python_workers"]

[vars]
FIO_ENV = "demo_mock"

# Limite aproximado de chamadas Groq por POP (Cloudflare, 5/min).
# Uma cota global financeira estrita requer Durable Objects + controle no Groq.
[[ratelimits]]
name = "FIO_GROQ_RATE"
namespace_id = "2026102807"

[ratelimits.simple]
limit = 5
period = 60

# Workers Logs no plano Free (3 dias de retenção segundo Cloudflare em 28/10/2026).
# Nao incluir binding Analytics Engine antes de habilitacao voluntaria da conta.
[observability]
enabled = true
head_sampling_rate = 1
